<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marktfabrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e4de;--fg:#1d2a33;--card:#f4f2ed;--br:#bdb9ad;--ac:#0f766e;--ac2:#b45309;--bad:#b91c1c;--cell:#d7d4cb}
@media(prefers-color-scheme:dark){:root{--bg:#1a2026;--fg:#e4e7ea;--card:#232b32;--br:#3d4852;--ac:#2dd4bf;--ac2:#f59e0b;--bad:#f87171;--cell:#2d363e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.tab,button,.num{font-family:'Barlow Semi Condensed',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:10px 16px;background:var(--fg);color:var(--bg)}
header h1{margin:0;font-size:22px}.num{font-size:20px;font-weight:700}
.sp{margin-left:auto}
button{font-size:14px;border:1px solid var(--br);background:var(--card);color:var(--fg);padding:5px 10px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header button{background:transparent;color:inherit;border-color:#7a8791}
nav{display:flex;gap:2px;padding:8px 16px 0;border-bottom:2px solid var(--fg)}
.tab{border:0;border-radius:3px 3px 0 0;padding:8px 18px;font-size:16px;font-weight:600;background:var(--cell)}
.tab.on{background:var(--fg);color:var(--bg)}
main{padding:16px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--br);border-radius:4px;padding:12px 14px;margin-bottom:12px}
h2{margin:0 0 6px;font-size:19px}h3{margin:10px 0 4px;font-size:16px}
.muted{opacity:.7;font-size:13px}.neg{color:var(--bad)}.pos{color:var(--ac)}
svg.map{width:100%;max-height:560px;background:var(--card);border:1px solid var(--br);border-radius:4px;display:block}
svg text{font-family:'Barlow Semi Condensed',sans-serif;fill:var(--fg)}
.node{cursor:pointer}.node:hover circle{stroke:var(--ac2);stroke-width:.8}
svg.fab{width:100%;max-width:720px;display:block;margin:8px 0;border-radius:6px;background:var(--cell)}
.cell{fill:transparent;cursor:pointer}.cell:hover{fill:rgba(255,255,255,.22);stroke:var(--ac2);stroke-width:1.5}
.flow{animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}
.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box}@keyframes puff{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-14px);opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.spin,.puff{animation:none}}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tools,.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
table{border-collapse:collapse;width:100%}td{padding:5px 6px;border-bottom:1px solid var(--br)}
#start{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:24px 16px;z-index:5}
#start .in{max-width:760px;margin:0 auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.pick button{text-align:left;padding:10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
input{font:inherit;padding:6px 8px;border:1px solid var(--br);border-radius:3px;background:var(--card);color:var(--fg);width:90px}
input#nm{width:200px}
</style>
</head>
<body>
<div id="start"><div class="in">Verbinde mit der Fabrikwelt …</div></div>
<header>
  <h1>Marktfabrik</h1>
  <div>Geld <span class="num" id="hm">0</span> €</div>
  <div>Produktion <span class="num" id="hr">0</span>/s</div>
  <div>Spieler <span class="num" id="hp">0</span></div>
  <div class="sp"><button onclick="leave()">Fabrik aufgeben</button></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,set,get,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCxPiwSvulutFAWjXdgRtZApqLgrsRiAgI",authDomain:"marktfabrik.firebaseapp.com",databaseURL:"https://marktfabrik-default-rtdb.europe-west1.firebasedatabase.app",projectId:"marktfabrik",storageBucket:"marktfabrik.firebasestorage.app",messagingSenderId:"784207356146",appId:"1:784207356146:web:7eeda95c356d3d976c306b"});
const db=getDatabase(app);

const IT={erz:['Erz',10,'#a8703a'],holz:['Holz',8,'#4d8c3a'],korn:['Getreide',6,'#c9a227'],eisen:['Eisen',28,'#6b7a8c'],brett:['Bretter',22,'#b5834a'],mehl:['Mehl',16,'#a39a80'],werk:['Werkzeug',90,'#0f766e'],brot:['Brot',45,'#d97706']};
const RC={erz:['Bergwerk',{}],holz:['Forstbetrieb',{}],korn:['Farm',{}],eisen:['Schmelze',{erz:2}],brett:['Sägewerk',{holz:2}],mehl:['Mühle',{korn:2}],werk:['Werkstatt',{eisen:1,brett:1}],brot:['Bäckerei',{mehl:1,holz:1}]};
const FINAL=['werk','brot'];
const NN=['Nord','Ost','Süd','West','Berg','Tal','Fluss','See','Hain','Stein','Mark','Hafen'];
const PRODS=['erz','holz','korn','eisen','brett','mehl','werk','brot','erz','holz','korn','eisen','brett','mehl','werk','brot','erz','korn','eisen','werk'];
const POS=PRODS.map((_,i)=>{const r=Math.floor(i/5),c=i%5;return[12+c*19+((r*7+c*3)%5-2),14+r*24+((c*5+r)%3-1)]});
const W=9,H=6,COST={B:4,E:30,A:30},UP={B:.02,E:0,A:0};
for(let i=1;i<=5;i++){COST[i]=120;UP[i]=.4}
// Arbeitsschritte, die eine Fabrik selbst übernehmen kann (Reihenfolge = Stufen im Layout)
const CHAIN={erz:['erz'],holz:['holz'],korn:['korn'],eisen:['erz','eisen'],brett:['holz','brett'],mehl:['korn','mehl'],werk:['erz','eisen','holz','brett','werk'],brot:['korn','mehl','holz','brot']};
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('de-DE');
const uid=(()=>{try{let u=localStorage.getItem('mf-uid');if(!u){u=Math.random().toString(36).slice(2,12);localStorage.setItem('mf-uid',u)}return u}catch(e){return Math.random().toString(36).slice(2,12)}})();
let R={},V={},P=null,G=null,ST={rate:0,up:0,n:0,ok:0,avg:0},off=0,tab='map',sel=null,tool='M',sat={werk:0,brot:0},busy=false,tk=0;
const nq=()=>Math.floor((Date.now()+off)/10000);
const fref=id=>ref(db,'world/factories/'+id);
const enc=g=>g.map(r=>r.map(c=>c||'.').join('')).join('/');
const dec=(s,p)=>s.split('/').map(r=>[...r].map(c=>c==='.'?'':c==='M'?String(CHAIN[p].length):c));
function initGrid(p){const g=Array.from({length:H},()=>Array(W).fill(''));g[2][0]='E';g[2][8]='A';g[2][4]=String(CHAIN[p].length);for(const x of [1,2,3,5,6,7])g[2][x]='B';return g}

// Layout-Auswertung
function bfs(g,ch){const d=Array.from({length:H},()=>Array(W).fill(Infinity)),q=[];
  g.forEach((r,y)=>r.forEach((c,x)=>{if(c&&ch.includes(c)){d[y][x]=0;q.push([x,y])}}));
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H)continue;const c=g[b][a];if((c==='B'||c==='E'||c==='A')&&d[b][a]===Infinity){d[b][a]=d[y][x]+1;q.push([a,b])}}}return d}
function near(d,x,y){let m=Infinity;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H)continue;if(d[b][a]+1<m)m=d[b][a]+1}return m}
function stats(g,p){
  const ch=CHAIN[p],has={},tiles={};ch.forEach(it=>{tiles[it]=[];has[it]=false});
  let up=0;g.forEach((r,y)=>r.forEach((c,x)=>{up+=UP[c]||0;if(/\d/.test(c)){const it=ch[+c-1];if(it){tiles[it].push([x,y]);has[it]=true}}}));
  const per={},ext={};
  (function dem(it,a){if(has[it]){per[it]=(per[it]||0)+a;for(const k in RC[it][1])dem(k,a*RC[it][1][k])}else ext[it]=(ext[it]||0)+a})(p,1);
  const dA=bfs(g,'A'),dE=bfs(g,'E'),dS={};ch.forEach((it,i)=>dS[it]=bfs(g,String(i+1)));
  const rows=[];let fin=has[p]?Infinity:0,n=0,ok=0;
  for(const it of ch){if(!has[it])continue;
    const ci=ch.filter(c2=>has[c2]&&RC[c2][1][it]).map(c2=>ch.indexOf(c2)+1).join(''),dC=ci?bfs(g,ci):null;
    let r=0,nok=0;
    for(const [x,y] of tiles[it]){let d=0,bad=false;
      for(const k in RC[it][1]){const m=has[k]?near(dS[k],x,y):near(dE,x,y);if(m===Infinity)bad=true;else d+=m}
      const o=it===p?near(dA,x,y):(dC?near(dC,x,y):Infinity);if(o===Infinity)bad=true;else d+=o;
      if(!bad){nok++;r+=1/(3+.4*d)}}
    n+=tiles[it].length;ok+=nok;rows.push({it,np:tiles[it].length,nok,r,per:per[it]||0});
    if(per[it])fin=Math.min(fin,r/per[it])}
  return{rows,rate:fin,up,ext,n,ok}}

// Welt-Simulation: gleiche Rechnung auf jedem Client, Stand wird nur bei Handel gespeichert
const needOf=f=>f.owner?(f.need||RC[f.p][1]):RC[f.p][1];
function proj(f){const c=JSON.parse(JSON.stringify(f)),npc=!c.owner,need=needOf(c),N=nq(),rate=npc?c.eff*.3:(c.rate||0);
  c.inv=c.inv||{};c.pr=c.pr||0;const n=Math.min(360,Math.max(0,N-c.t));
  for(let i=0;i<n;i++){
    if(npc){for(const k in need)c.inv[k]=Math.min(25,(c.inv[k]||0)+.6*c.eff);c.stock=Math.max(0,c.stock-.8)}
    c.pr+=rate*10;
    while(c.pr>=1){if(c.stock>=(npc?60:300)||!Object.keys(need).every(k=>(c.inv[k]||0)>=need[k])){c.pr=Math.min(c.pr,1);break}
      for(const k in need)c.inv[k]-=need[k];c.stock++;c.pr--}}
  c.t=N;return c}
const ask=f=>f.price>0?f.price:Math.round(IT[f.p][1]*(1.35-.7*Math.min(f.stock/50,1)));
const bid=(f,k)=>Math.round(IT[k][1]*(.6+.5*(1-Math.min((f.inv[k]||0)/30,1))));
const cityP=k=>Math.round(IT[k][1]*(.85+.2*Math.sin(nq()/4+IT[k][1]))*(1-Math.min(.5,sat[k]||0)));
const owner=f=>f.owner?(f.owner===uid?'Du':f.ownerName||'Spieler'):'NPC';

async function seed(){await runTransaction(ref(db,'world/factories'),cur=>{if(cur)return;const o={};
  POS.forEach((q,i)=>{const p=PRODS[i],inv={};for(const k in RC[p][1])inv[k]=8;
    o[i]={p,nm:RC[p][0]+' '+NN[i%12]+(i>=12?' II':''),x:q[0],y:q[1],eff:+(.6+Math.random()*.6).toFixed(2),rate:0,stock:18,inv,t:nq(),pr:0,earn:0}});return o})}
async function claim(p,name){
  for(const id of Object.keys(R).filter(i=>R[i].p===p&&!R[i].owner)){let ok=false;const g=initGrid(p);
    await runTransaction(fref(id),cur=>{ok=false;if(!cur||cur.owner)return;const f=proj(cur);f.owner=uid;f.ownerName=name;f.nm=name+' ('+RC[p][0]+')';f.grid=enc(g);const s0=stats(g,p);f.rate=s0.rate;f.need=s0.ext;f.price=0;ok=true;return f});
    if(ok){P={name,money:600,w:{},fid:id,prod:p};G=g;sel=+id;await savePlayer();return true}}
  return false}
function savePlayer(){return set(ref(db,'players/'+uid),P)}
function saveLayout(){const g=G;runTransaction(fref(P.fid),cur=>{if(!cur||cur.owner!==uid)return;const f=proj(cur);f.grid=enc(g);const s1=stats(g,P.prod);f.rate=s1.rate;f.need=s1.ext;return f})}

// Handel (alles als Transaktion, damit nichts doppelt verkauft wird)
async function trade(id,kind,k,n){let out=null;
  await runTransaction(fref(id),cur=>{out=null;if(!cur)return;const f=proj(cur);let c=0,tot=0;
    if(kind==='buy'){while(c<n&&f.stock>=1&&tot+ask(f)<=P.money&&(P.w[f.p]||0)+c<300){tot+=ask(f);f.stock--;c++}}
    else if(kind==='sell'){while(c<n&&c<(P.w[k]||0)&&(f.inv[k]||0)<40){tot+=bid(f,k);f.inv[k]=(f.inv[k]||0)+1;c++}}
    else if(kind==='load'){c=Math.min(n,P.w[k]||0);f.inv[k]=(f.inv[k]||0)+c}
    else if(kind==='city'){const p=cityP(k);while(c<n&&f.stock>=1){tot+=p;f.stock--;c++}}
    if(!c)return;
    if(f.owner&&f.owner!==uid){f.earn=(f.earn||0)+(kind==='buy'?tot:-tot)}
    out={c,tot};return f});
  if(!out)return;const{c,tot}=out;
  if(kind==='buy'){P.money-=tot;P.w[IT[R[id].p]?R[id].p:k]=(P.w[R[id].p]||0)+c}
  else if(kind==='sell'){P.money+=tot;P.w[k]-=c}
  else if(kind==='load'){P.w[k]-=c}
  else{P.money+=tot;sat[k]=(sat[k]||0)+.015*c}
  savePlayer();head();render()}
function collect(){const f=R[P.fid];if(!f||!f.earn||busy)return;busy=true;let e=0;
  runTransaction(ref(db,'world/factories/'+P.fid+'/earn'),cur=>{e=cur||0;return 0}).then(()=>{P.money+=e;busy=false;savePlayer()}).catch(()=>busy=false)}
function place(x,y){const c=G[y][x];
  if(tool==='X'){if(c){P.money+=Math.floor(COST[c]/2);G[y][x]=''}}
  else if(!c&&P.money>=COST[tool]){P.money-=COST[tool];G[y][x]=tool}else return;
  ST=stats(G,P.prod);saveLayout();savePlayer();head();render()}
function setPrice(){const v=Math.max(0,+$('#pr').value|0);runTransaction(fref(P.fid),cur=>{if(!cur||cur.owner!==uid)return;const f=proj(cur);f.price=v;return f})}
async function leave(){if(!P||!confirm('Fabrik aufgeben? Sie wird wieder von einem NPC geführt.'))return;
  const id=P.fid;await runTransaction(fref(id),cur=>{if(!cur||cur.owner!==uid)return;const f=proj(cur);delete f.owner;delete f.ownerName;delete f.grid;f.rate=0;f.price=0;f.nm=RC[f.p][0]+' '+NN[id%12]+(id>=12?' II':'');return f});
  await set(ref(db,'players/'+uid),null);P=null;G=null;pick()}

// Darstellung
function head(){if(!P)return;$('#hm').textContent=fmt(P.money);$('#hm').className='num'+(P.money<0?' neg':'');
  $('#hr').textContent=ST.rate.toFixed(2);$('#hp').textContent=Object.values(R).filter(f=>f.owner).length}
function render(){if(!P)return;
  $('#tabs').innerHTML=[['map','Karte'],['fab','Meine Fabrik'],['lager','Lager & Stadt']].map(t=>`<button class="tab ${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
  $('#main').innerHTML=tab==='map'?vMap():tab==='fab'?vFab():vLager();if(tab==='fab')upd()}
function vMap(){let s='<svg class="map" viewBox="0 0 100 100" onclick="mapClick(event)" role="img" aria-label="Karte aller Fabriken">';
  const ids=Object.keys(V);
  for(const a of ids)for(const b of ids)if(RC[V[b].p][1][V[a].p])s+=`<line x1="${V[a].x}" y1="${V[a].y}" x2="${V[b].x}" y2="${V[b].y}" stroke="${IT[V[a].p][2]}" stroke-opacity=".22" stroke-width=".4"/>`;
  s+='<rect x="43" y="48" width="14" height="4" rx=".8" fill="none" stroke="currentColor" stroke-width=".4"/><text x="50" y="51" font-size="2.8" text-anchor="middle" font-weight="700">Stadt</text>';
  for(const id of ids){const f=V[id],me=f.owner===uid;
    s+=`<g class="node" data-id="${id}"><circle cx="${f.x}" cy="${f.y}" r="${me?4.8:3.8}" fill="${IT[f.p][2]}" stroke="${id==sel?'var(--ac2)':me?'var(--fg)':f.owner?'var(--ac)':'none'}" stroke-width="${id==sel?1:.7}"/><text x="${f.x}" y="${f.y+1}" font-size="2.6" text-anchor="middle" style="fill:#fff;font-weight:700">${IT[f.p][0].slice(0,3)}</text><text x="${f.x}" y="${f.y+7.4}" font-size="2.3" text-anchor="middle">${owner(f)} · ${RC[f.p][0]}</text></g>`}
  s+='</svg><p class="muted">Ring in Türkis = von einem Spieler geführt. Linien zeigen Lieferbeziehungen. Klicke eine Fabrik zum Handeln.</p>';
  return s+(sel!==null&&V[sel]?fPanel(V[sel],sel):'')}
function fPanel(f,id){const need=Object.entries(needOf(f));
  let h=`<div class="card"><h2><span class="dot" style="background:${IT[f.p][2]}"></span>${f.nm}</h2><p class="muted">Geführt von: ${owner(f)}</p>`;
  if(f.owner===uid)return h+'<p>Das ist deine Fabrik. Layout im Reiter „Meine Fabrik“, Lager und Preis unter „Lager & Stadt“.</p></div>';
  h+=`<h3>Kaufen: ${IT[f.p][0]}</h3><div class="row"><span>${f.stock|0} auf Lager · <b>${ask(f)} €</b> pro Stück</span><button onclick="trade(${id},'buy','',1)">+1</button><button onclick="trade(${id},'buy','',10)">+10</button><button onclick="trade(${id},'buy','',1e9)">Max</button></div>`;
  if(need.length){h+='<h3>Verkaufen an diese Fabrik</h3>';for(const [k] of need)h+=`<div class="row"><span>${IT[k][0]}: <b>${bid(f,k)} €</b> (du trägst ${P.w[k]||0})</span><button onclick="trade(${id},'sell','${k}',1)">1</button><button onclick="trade(${id},'sell','${k}',10)">10</button><button onclick="trade(${id},'sell','${k}',1e9)">Alle</button></div>`}
  return h+'</div>'}
function scene(){
  const T=40,ch=CHAIN[P.prod],dA=bfs(G,'A'),act={},net=c=>c==='B'||c==='E'||c==='A',on=(x,y)=>G[y]&&G[y][x];
  (ST.rows||[]).forEach(r=>act[r.it]=r.per>0&&r.nok>0);
  let fl='',rl='',bt='',dash='',bld='',ov='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=G[y][x],cx=x*T+T/2,cy=y*T+T/2;
    fl+=`<rect x="${x*T}" y="${y*T}" width="${T}" height="${T}" fill="${(x+y)%2?'rgba(0,0,0,.06)':'rgba(255,255,255,.06)'}"/>`;
    if(net(c)){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,n=on(nx,ny);if(!n)continue;
        const mx=cx+dx*T/2,my=cy+dy*T/2,d1=dA[y][x],d2=net(n)?dA[ny][nx]:Infinity,seg=`M${cx} ${cy}L${mx} ${my}`,rev=`M${mx} ${my}L${cx} ${cy}`;
        rl+=`<path d="${seg}"/>`;bt+=`<path d="${seg}"/>`;
        if(net(n)&&isFinite(d1)&&isFinite(d2)&&d1!==d2)dash+=`<path class="flow" d="${d1>d2?seg:rev}"/>`}
      rl+=`<circle cx="${cx}" cy="${cy}" r="1"/>`;bt+=`<circle cx="${cx}" cy="${cy}" r="1"/>`}
    if(c==='E'||c==='A')bld+=`<rect x="${x*T+3}" y="${y*T+6}" width="${T-6}" height="${T-12}" rx="5" fill="#c2670c" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/><text x="${cx}" y="${cy+3.5}" font-size="10" text-anchor="middle" style="fill:#fff;font-weight:700">${c==='E'?'IN ▶':'▶ OUT'}</text>`;
    else if(/\d/.test(c)){const it=ch[+c-1];if(!it)continue;const a=act[it],col=IT[it][2];
      bld+=`<g><rect x="${x*T+3}" y="${y*T+5}" width="${T-6}" height="${T-8}" rx="6" fill="${a?col:'#8a8f94'}" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/><rect x="${x*T+3}" y="${y*T+5}" width="${T-6}" height="9" rx="4" fill="rgba(255,255,255,.28)"/><rect x="${x*T+8}" y="${y*T-1}" width="6" height="7" fill="#444"/>${a?`<circle class="puff" cx="${x*T+11}" cy="${y*T+2}" r="3" fill="#fff"/>`:''}<text class="${a?'spin':''}" x="${cx}" y="${cy+4}" font-size="14" text-anchor="middle" style="fill:#fff">⚙</text><text x="${cx}" y="${y*T+T-6}" font-size="7" text-anchor="middle" style="fill:#fff;font-weight:700">${IT[it][0].slice(0,5)}</text><circle cx="${x*T+T-9}" cy="${y*T+12}" r="2.5" fill="${a?'#4ade80':'#f87171'}"/></g>`}
    ov+=`<rect class="cell" data-x="${x}" data-y="${y}" x="${x*T}" y="${y*T}" width="${T}" height="${T}"/>`}
  return `<svg class="fab" viewBox="0 0 ${W*T} ${H*T}" onclick="cellClick(event)" role="img" aria-label="Fabriklayout">${fl}<g fill="none" stroke-linecap="round"><g stroke="#9aa3aa" stroke-width="22">${rl}</g><g stroke="#3b4650" stroke-width="16">${bt}</g><g stroke="#e6e9ec" stroke-width="3" stroke-dasharray="3 9" opacity=".85">${dash}</g></g>${bld}${ov}</svg>`}
function vFab(){const ch=CHAIN[P.prod];
  const tl=[...ch.map((it,i)=>[String(i+1),RC[it][0],COST[1],IT[it][2]]),['B','Band',COST.B],['E','Eingang',COST.E],['A','Ausgang',COST.A],['X','Abriss',0]];
  return `<div class="card"><h2>${RC[P.prod][0]}: Layout</h2><p class="muted">Baue Arbeitsschritte hintereinander: ${ch.map(it=>RC[it][0]).join(' → ')}. Jede Stufe, die du baust, stellt ihr Zwischenprodukt selbst her. Fehlt eine Stufe, lädst du dieses Material fertig ins Werkslager (Kauf bei anderen). Maschinen verbindest du über Bänder oder direktes Nebeneinander. Der Eingang (IN) holt Material aus dem Werkslager, der Ausgang (OUT) liefert Fertiges. Die Stufe mit dem kleinsten Durchsatz bestimmt den Ausstoß. Deine Fabrik produziert auch offline.</p>
  <div class="tools">${tl.map(t=>`<button class="${tool===t[0]?'on':''}" onclick="setTool('${t[0]}')">${t[3]?`<span class="sw" style="background:${t[3]}"></span>`:''}${t[1]}${t[2]?' · '+t[2]+' €':''}</button>`).join('')}</div>
  ${scene()}<div id="stats"></div></div>`}
function upd(){const el=$('#stats');if(!el)return;const st=ST,ex=Object.entries(st.ext||{}),
  cost=ex.reduce((a,[k,n])=>a+n*IT[k][1],0)*st.rate,m=IT[P.prod][1]*st.rate-cost-st.up;
  el.innerHTML=`<table>${(st.rows||[]).map(r=>`<tr><td><span class="sw" style="background:${IT[r.it][2]}"></span>${RC[r.it][0]}</td><td>${r.nok} von ${r.np} verbunden</td><td>${r.per?(r.r/r.per).toFixed(2)+'/s'+(Math.abs(r.r/r.per-st.rate)<1e-9?' · Engpass':''):'ungenutzt'}</td></tr>`).join('')}
  <tr><td colspan="2">Ausstoß ${IT[P.prod][0]}</td><td>${st.rate.toFixed(2)}/s</td></tr>
  <tr><td colspan="2">Material von außen je Stück</td><td>${ex.map(([k,n])=>n+'× '+IT[k][0]).join(', ')||'keins'}</td></tr>
  <tr><td colspan="2">Unterhalt</td><td>${st.up.toFixed(2)} €/s</td></tr>
  <tr><td colspan="2">Grobe Marge (Richtpreise)</td><td class="${m<0?'neg':'pos'}">${m.toFixed(2)} €/s</td></tr></table>`}
function vLager(){const f=V[P.fid],need=Object.keys(needOf(f));
  let h=`<div class="card"><h2>Mein Werk: ${IT[P.prod][0]}</h2><p>Fertig auf Lager: <b>${f.stock|0}</b> · Verkaufspreis ${ask(f)} €${f.price>0?' (von dir festgelegt)':' (automatisch)'}</p>
  <div class="row">Eigener Preis (0 = automatisch) <input id="pr" type="number" min="0" value="${f.price||0}"><button onclick="setPrice()">Setzen</button></div>`;
  if(FINAL.includes(P.prod))h+=`<div class="row">Stadt zahlt <b>${cityP(P.prod)} €</b><button onclick="trade(${P.fid},'city','${P.prod}',10)">10 verkaufen</button><button onclick="trade(${P.fid},'city','${P.prod}',1e9)">Alle</button></div><p class="muted">Der Stadtpreis sinkt bei großen Mengen und erholt sich langsam.</p>`;
  if(need.length){h+='<h3>Werkslager (Material)</h3>';for(const k of need)h+=`<div class="row">${IT[k][0]}: <b>${Math.floor(f.inv[k]||0)}</b> im Werk · du trägst ${P.w[k]||0}<button onclick="trade(${P.fid},'load','${k}',10)">10 laden</button><button onclick="trade(${P.fid},'load','${k}',1e9)">Alle laden</button></div>`}
  h+='</div><div class="card"><h3>Was du trägst</h3>';const ks=Object.keys(P.w).filter(k=>P.w[k]>0);
  return h+(ks.length?ks.map(k=>`<div>${IT[k][0]}: ${P.w[k]}</div>`).join(''):'<p class="muted">Nichts. Kaufe auf der Karte Material bei anderen Fabriken.</p>')+'</div>'}
function pick(msg){const el=$('#start');el.hidden=false;
  const free=p=>Object.values(R).filter(f=>f.p===p&&!f.owner).length;
  el.innerHTML=`<div class="in"><h1 style="font-size:32px;margin:0">Marktfabrik</h1><p>Eine gemeinsame Fabrikwelt für alle Spieler. Du übernimmst eine freie Fabrik, kaufst Material bei anderen (Spielern oder NPCs), verarbeitest es und verkaufst weiter. Freie Fabriken führt der Computer.</p>${msg?`<p class="neg">${msg}</p>`:''}
  <p><label>Dein Name <input id="nm" value="${(P&&P.name)||'Spieler'}" maxlength="16"></label></p><h2>Was willst du produzieren?</h2><div class="pick">
  ${Object.keys(RC).map(k=>{const n=Object.entries(RC[k][1]).map(([a,c])=>c+'× '+IT[a][0]).join(' + ');return `<button ${free(k)?'':'disabled'} onclick="go('${k}')"><b><span class="dot" style="background:${IT[k][2]}"></span>${IT[k][0]}</b><br>${RC[k][0]}<br><span class="muted">${n?'braucht '+n:'braucht kein Material'} · ${free(k)} frei</span></button>`}).join('')}</div></div>`}
async function go(p){const ok=await claim(p,($('#nm').value||'Spieler').trim());if(!ok){pick('Diese Fabrik wurde gerade vergeben. Wähle eine andere.');return}enter()}
function enter(){$('#start').hidden=true;P.w=P.w||{};ST=stats(G,P.prod);tool=String(CHAIN[P.prod].length);if(R[P.fid]&&!R[P.fid].need&&Object.keys(RC[P.prod][1]).length)saveLayout();V=Object.fromEntries(Object.entries(R).map(([i,f])=>[i,proj(f)]));head();render()}
function tick(){if(!P)return;tk++;V=Object.fromEntries(Object.entries(R).map(([i,f])=>[i,proj(f)]));
  P.money-=ST.up;collect();if(tk%10===0)savePlayer();head();if(tab!=='fab')render()}
Object.assign(window,{trade,place,setPrice,leave,go,cellClick:e=>{const r=e.target.closest('.cell');if(r)place(+r.dataset.x,+r.dataset.y)},
  setTab:t=>{tab=t;render()},setTool:t=>{tool=t;render()},mapClick:e=>{const g=e.target.closest('[data-id]');if(g){sel=+g.dataset.id;render()}}});

// Start
try{
  onValue(ref(db,'.info/serverTimeOffset'),s=>{off=s.val()||0});
  const ps=await get(ref(db,'players/'+uid));
  await new Promise((res,rej)=>onValue(ref(db,'world/factories'),s=>{if(!s.exists()){seed();return}R=s.val();if(Array.isArray(R))R=Object.fromEntries(R.map((f,i)=>[i,f]).filter(a=>a[1]));res()},rej));
  const sp=ps.val();
  if(sp&&R[sp.fid]&&R[sp.fid].owner===uid){P=sp;P.prod=R[sp.fid].p;G=R[sp.fid].grid?dec(R[sp.fid].grid,P.prod):initGrid(P.prod);sel=+sp.fid;enter()}else pick();
  setInterval(tick,1000);
}catch(e){$('#start').innerHTML='<div class="in"><h2>Verbindung fehlgeschlagen</h2><p>Prüfe, ob die Realtime Database im Testmodus läuft. Fehler: '+e.message+'</p></div>'}
</script>
</body>
